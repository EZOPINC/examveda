# Install after replacing example.com with the approved public hostname(s).
# Gunicorn must remain bound to 127.0.0.1; do not add a public 8000 rule.
log_format wbp_platform '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    server_tokens off;
    client_max_body_size 26m;
    access_log /var/log/nginx/wbpsc-platform.access.log wbp_platform;
    error_log /var/log/nginx/wbpsc-platform.error.log warn;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WBPSC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /srv/wbpsc-platform/current/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Uploaded files are intentionally not mapped to a public URL or directory.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrite the header; Django trusts it only because Gunicorn is loopback-only.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
