<div class="share-controls" data-share-controls data-share-title="{{ share_title }}" data-share-url="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}" hidden>
    <button type="button" class="button button-secondary" data-share-page>Share</button>
    <button type="button" class="button button-secondary" data-copy-page-link>Copy link</button>
    <p class="share-status" data-share-status role="status" aria-live="polite"></p>
</div>
