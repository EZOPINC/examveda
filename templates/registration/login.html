<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | WBPSC Mock Exam Platform</title>
    {% load static %}<link rel="stylesheet" href="{% static 'content/content.css' %}">
</head>
<body>
    <header class="site-header"><a href="{% url 'home' %}">WBPSC Mock Exam Platform</a></header>
    <main class="page-shell article">
        <h1>Sign in</h1>
        {% if form.errors %}<p role="alert">The username or password was not accepted.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign in</button>
        </form>
        <p>Student account registration is not available yet. Accounts are provisioned by an administrator during this phase.</p>
    </main>
</body>
</html>
